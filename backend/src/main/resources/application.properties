# ==========================================
# CONEXIÓN A MYSQL (Vía Variables de Entorno)
# ==========================================
# Cuando lo corras en local, usa localhost. En producción, Render inyectará la URL de TiDB.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/anime_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Root2003}

# ==========================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# PUERTO DEL SERVIDOR
# ==========================================
# Render asigna puertos dinámicos. Esto le dice: "Usa el puerto de Render, o el 8080 en mi PC"
server.port=${PORT:8080}

# ==========================================
# CONFIGURACIÓN DEL BOT DE TELEGRAM
# ==========================================
telegram.bot.username=${TELEGRAM_BOT_USERNAME:twainf_bot}
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.channel.id=${TELEGRAM_CHANNEL_ID:-1004460671301}